# 聊天室 HTTPS 站点（将 dst.example.com 替换为你的域名，证书按实际路径调整）
server {
    server_name dst.example.com;

    # 登录接口限流：10 次/分钟，突发 20；超限直接 429（配合 cloudflare-realip.conf 按真实 IP 计数）
    location = /login {
        limit_req zone=loginlimit burst=20 nodelay;
        limit_req_status 429;

        proxy_pass http://127.0.0.1:8083;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        proxy_pass http://127.0.0.1:8083;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    listen 443 ssl;
    ssl_certificate /etc/letsencrypt/live/dst.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/dst.example.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
}

server {
    if ($host = dst.example.com) {
        return 301 https://$host$request_uri;
    }

    listen 80 default_server;
    server_name dst.example.com;
    return 404;
}
